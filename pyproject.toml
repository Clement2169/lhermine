[project]
name = "lhermine"
version = "0.1.0"
description = "Site web Résidence l'Hermine"
authors = [
    {name = "lhermine"}
]
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.streamlit]
# Options de lancement
[tool.pytest.ini_options]
testpaths = ["tests"]
